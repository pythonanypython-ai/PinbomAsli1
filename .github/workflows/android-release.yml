name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional API base URL (must end with /). Defaults to PINBOM_API_BASE_URL repository variable.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and sign PinBom
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # "platforms;android-37.0" حذف شد تا Gradle خودش پلتفرم را Resolve کند.
          # build-tools و NDK و CMake همچنان نصب می‌شوند.
          packages: 'platform-tools build-tools;37.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Check release signing secrets and decode JKS
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/pinbom-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          # -storetype JKS حذف شد تا با PKCS12 هم سازگار باشد.
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo 'JKS keystore decoded and validated successfully.'

      - name: Resolve and validate API base URL
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          REPOSITORY_API_BASE_URL: ${{ vars.PINBOM_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          API_BASE_URL="${INPUT_API_BASE_URL:-}"
          if [[ -z "$API_BASE_URL" ]]; then
            API_BASE_URL="${REPOSITORY_API_BASE_URL:-}"
          fi

          if [[ -z "$API_BASE_URL" ]]; then
            echo 'Set the PINBOM_API_BASE_URL repository variable or provide api_base_url when manually starting this workflow.' >&2
            exit 1
          fi

          case "$API_BASE_URL" in
            https://*) ;;
            http://185.26.33.188:8080/) ;;
            *)
              echo 'API URL must use HTTPS, or exactly http://185.26.33.188:8080/ while the temporary HTTP endpoint is in use.' >&2
              exit 1
              ;;
          esac

          if [[ "$API_BASE_URL" != */ ]]; then
            echo 'API URL must end with /' >&2
            exit 1
          fi

          echo "PINBOM_API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
          echo "Using API base URL: $API_BASE_URL"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests, lint, and build signed Release APK/AAB
        env:
          PINBOM_STORE_FILE: ${{ runner.temp }}/pinbom-release.jks
          PINBOM_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PINBOM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PINBOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease \
            -PPINBOM_API_BASE_URL="$PINBOM_API_BASE_URL"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Prepare release files and SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK_PATH"
          test -s "$AAB_PATH"

          cp "$APK_PATH" "dist/PinBom-${GITHUB_REF_NAME}.apk"
          cp "$AAB_PATH" "dist/PinBom-${GITHUB_REF_NAME}.aab"

          (
            cd dist
            sha256sum \
              "PinBom-${GITHUB_REF_NAME}.apk" \
              "PinBom-${GITHUB_REF_NAME}.aab" \
              > SHA256SUMS.txt
          )

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinBom-${{ github.ref_name }}-release
          path: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets with --clobber."
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.apk \
              dist/*.aab \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.apk \
              dist/*.aab \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "PinBom $GITHUB_REF_NAME" \
              --generate-notes
          fi
