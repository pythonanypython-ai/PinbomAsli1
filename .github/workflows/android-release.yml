name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional HTTPS API base URL (overrides the repository variable)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and sign Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |-
            platform-tools
            platforms;android-37
            build-tools;36.0.0
            build-tools;37.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pinbom-release.p12"
          test -s "$RUNNER_TEMP/pinbom-release.p12"
          chmod 600 "$RUNNER_TEMP/pinbom-release.p12"
          keytool -list -alias "$ANDROID_KEY_ALIAS" -keystore "$RUNNER_TEMP/pinbom-release.p12" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Resolve release API URL
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          REPOSITORY_API_BASE_URL: ${{ vars.PINBOM_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL="${INPUT_API_BASE_URL:-}"
          if [[ -z "$API_BASE_URL" ]]; then
            API_BASE_URL="${REPOSITORY_API_BASE_URL:-}"
          fi
          if [[ -z "$API_BASE_URL" ]]; then
            echo 'Set the PINBOM_API_BASE_URL repository variable or pass api_base_url to workflow_dispatch.' >&2
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo 'Release API URL must start with https://' >&2; exit 1 ;;
          esac
          case "$API_BASE_URL" in
            */) ;;
            *) echo 'Release API URL must end with /' >&2; exit 1 ;;
          esac
          echo "PINBOM_API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests, lint and build signed Release APK/AAB
        env:
          PINBOM_STORE_FILE: ${{ runner.temp }}/pinbom-release.p12
          PINBOM_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PINBOM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PINBOM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease
          :app:bundleRelease
          -PPINBOM_API_BASE_URL="$PINBOM_API_BASE_URL"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PinBom-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/PinBom-${GITHUB_REF_NAME}.aab"
          (
            cd dist
            sha256sum "PinBom-${GITHUB_REF_NAME}.apk" "PinBom-${GITHUB_REF_NAME}.aab" > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PinBom-${{ github.ref_name }}-release
          path: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.apk dist/*.aab dist/SHA256SUMS.txt
          --verify-tag
          --title "PinBom $GITHUB_REF_NAME"
          --generate-notes
